# Inclus dans le contexte http{} — reverse proxy de l'application Tickets
log_format tickets '$remote_addr "$request" $status $body_bytes_sent rt=$request_time up=$upstream_addr';
limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;

upstream tickets_app {
    server 127.0.0.1:@APP_PORT@;
    keepalive 8;
}

server {
    listen 127.0.0.1:@WEB_PORT@;
    server_name tickets.example.org;
    server_tokens off;
    access_log logs/tickets-access.log tickets;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 256;
    gzip_types application/json text/plain text/html;

    location / {
        proxy_pass http://tickets_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://tickets_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
